name: Milhano | GHL test opportunity read-only audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/sofia-find-test.yml]
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - name: Read test opportunity through existing GHL credential
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: node scripts/sofia-find-test-opportunity.mjs
