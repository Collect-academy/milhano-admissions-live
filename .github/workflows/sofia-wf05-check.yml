name: Milhano | WF05 read-only check
on:
  push:
    branches: [main]
    paths: [.github/workflows/sofia-wf05-check.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Diagnose stage gate and recent executions
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: node scripts/operations/sofia-wf05-qa-readonly-20261111.mjs
