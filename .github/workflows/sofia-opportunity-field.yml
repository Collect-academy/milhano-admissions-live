name: Milhano | Provision Sofia opportunity field
on:
  push:
    branches: [main]
    paths: [.github/workflows/sofia-opportunity-field.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GHL_TOKEN: ${{ secrets.MILHANO_GHL_TOKEN || secrets.MILHANO_GHL_API_KEY || secrets.GHL_PRIVATE_INTEGRATION_TOKEN || secrets.GHL_API_TOKEN || secrets.GHL_TOKEN || secrets.GHL_API_KEY || secrets.LEADCONNECTOR_API_KEY }}
    steps:
      - name: Ensure opportunity field directly in GHL (no n8n execution)
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const loc='ZzRtp9n8n76ARy99VzJc', name='Sofia AI Touched';
          const token=process.env.GHL_TOKEN;
          if(!token) throw Error('No direct GHL token is configured in repository secrets. No n8n workflow or execution was created.');
          const base='https://services.leadconnectorhq.com/locations/'+loc+'/customFields';
          async function req(method,url,body){
            const r=await fetch(url,{method,headers:{Authorization:'Bearer '+token,Version:'v3',Accept:'application/json','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error(method+' GHL HTTP '+r.status);
            return r.json();
          }
          async function read(){
            const x=await req('GET',base+'?model=opportunity');
            if(!Array.isArray(x.customFields))throw Error('Unexpected custom field catalog');
            return x.customFields.filter(f=>f.name===name||f.fieldKey==='opportunity.sofia_ai_touched');
          }
          let matches=await read();
          if(matches.length===0){await req('POST',base,{name,dataType:'TEXT',model:'opportunity'});matches=await read();}
          if(matches.length!==1||matches[0].model!=='opportunity'||matches[0].dataType!=='TEXT'||!matches[0].id||matches[0].fieldKey!=='opportunity.sofia_ai_touched')throw Error('Field ambiguous or incompatible; no overwrite');
          console.log('VERIFIED_OPPORTUNITY_FIELD_ID='+matches[0].id);
          console.log('VERIFIED_OPPORTUNITY_FIELD_KEY='+matches[0].fieldKey);
          JS
