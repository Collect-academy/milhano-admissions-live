name: Milhano | Sofia Pilot Syntax Preflight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sofia-pilot-syntax.yml
      - scripts/sofia-pilot-20261109.mjs

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate the isolated pilot runner without launching calls
        run: node --check scripts/sofia-pilot-20261109.mjs
