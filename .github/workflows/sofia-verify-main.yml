name: Milhano | Sofia verify ElevenLabs main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sofia-verify-main.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read ElevenLabs main via existing n8n credential
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: node scripts/sofia-audit-agent-main.mjs
