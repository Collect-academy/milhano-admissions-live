name: Milhano | Sofía compile and checks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sofia-compile.yml
      - components/sofia-campaign-planner.tsx
      - lib/sofia-analytics.ts
      - app/sofia/**
      - app/api/sofia/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked project dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Compile TypeScript
        run: npx tsc --noEmit --incremental false
      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SECRET_KEY: placeholder
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

# Always validate the deployed main branch.