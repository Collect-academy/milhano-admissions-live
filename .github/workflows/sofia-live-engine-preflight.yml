name: Milhano | Sofía live engine syntax preflight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sofia-live-engine-preflight.yml
      - scripts/sofia-live-deploy-20261110.mjs
      - n8n/MILHANO_06_Sofia_Batch_Scheduler_V1_DISABLED.json
      - n8n/MILHANO_07_Sofia_Conversation_Reconciliation_DRAFT.json

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify safe deployment script syntax
        run: node --check scripts/sofia-live-deploy-20261110.mjs
      - name: Verify workflow references, JavaScript and cron trigger
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const paths=[
            "n8n/MILHANO_06_Sofia_Batch_Scheduler_V1_DISABLED.json",
            "n8n/MILHANO_07_Sofia_Conversation_Reconciliation_DRAFT.json",
          ];
          for(const path of paths){
            const w=JSON.parse(readFileSync(path,"utf8"));
            if(w.active!==false)throw Error("Source should not publish itself: "+path);
            const names=new Set(w.nodes.map(n=>n.name));
            for(const [from,group] of Object.entries(w.connections)){
              if(!names.has(from))throw Error("Missing source "+from);
              for(const links of group.main??[])for(const link of links)
                if(!names.has(link.node))throw Error("Missing edge "+link.node);
            }
            for(const node of w.nodes)
              if(node.type==="n8n-nodes-base.code")new Function(node.parameters.jsCode);
            console.log("VALIDATED:",w.name,"nodes:",w.nodes.length);
          }
          NODE
