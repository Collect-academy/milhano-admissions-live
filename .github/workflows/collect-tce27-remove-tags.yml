name: Collect TCE27 | Update no tags
on:
  push:
    branches: [ops/tce27-n8n-collect-only-20261110]
    paths: [.github/workflows/collect-tce27-remove-tags.yml]
permissions:
  contents: read
concurrency:
  group: collect-tce27-wf02-no-tags
  cancel-in-progress: false
jobs:
  update:
    if: "github.repository == 'Collect-academy/milhano-admissions-live' && github.event.head_commit.message == 'ops(collect): apply TCE27 no-tag workflow to n8n'"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check script syntax
        run: node --check ops/tce27/update-no-tags.mjs
      - name: Update ONLY TCE27 WF02 (existing credential)
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: node ops/tce27/update-no-tags.mjs
